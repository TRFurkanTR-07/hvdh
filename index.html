<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Tatlı Kız Meliss 💖</title>


    <!-- Limon Milk Font -->

    <style>

        @import url('https://fonts.cdnfonts.com/css/limon-milk');


        /* =========================
           TEMEL AYARLAR
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
        }


        body {

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Lemon/Milk', sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 105, 180, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(138, 43, 226, 0.25),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #16001f,
                    #3b0b45,
                    #13001c
                );

            color: white;
        }


        /* =========================
           ANA KUTU
        ========================== */

        .container {

            width: 100%;
            max-width: 650px;

            padding: 50px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.14);

            border-radius: 30px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);

            animation: containerIn 0.6s ease;

            position: relative;
            z-index: 5;
        }


        @keyframes containerIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           BAŞLIK
        ========================== */

        h1 {

            font-size: clamp(
                26px,
                6vw,
                46px
            );

            line-height: 1.35;

            margin-bottom: 35px;

            text-shadow:
                0 0 12px rgba(255, 105, 180, 0.55);

        }


        /* =========================
           BUTONLAR
        ========================== */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            flex-wrap: wrap;

        }


        button {

            min-width: 150px;

            padding: 15px 35px;

            border: none;

            border-radius: 999px;

            color: white;

            font-family: inherit;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            -webkit-tap-highlight-color: transparent;

        }


        /* EVET */

        .yes {

            background:
                linear-gradient(
                    135deg,
                    #ff4fa3,
                    #ff79bd
                );

            box-shadow:
                0 8px 22px rgba(
                    255,
                    79,
                    163,
                    0.30
                );

        }


        /* HAYIR */

        .no {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.20
                );

        }


        /* Bilgisayarda hover */

        @media (hover: hover) {

            button:hover {

                transform:
                    translateY(-3px)
                    scale(1.03);

            }

        }


        /* Telefonda basma */

        button:active {

            transform:
                scale(0.96);

        }


        /* =========================
           VIDEO
        ========================== */

        #result {

            display: none;

            margin-top: 30px;

            animation:
                videoIn 0.4s ease;

        }


        @keyframes videoIn {

            from {

                opacity: 0;

                transform:
                    scale(0.95);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        #result video {

            display: block;

            width: 100%;

            max-width: 480px;

            max-height: 55vh;

            margin: auto;

            border-radius: 22px;

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            background: #000;

            box-shadow:
                0 12px 35px rgba(
                    0,
                    0,
                    0,
                    0.4
                );

            object-fit: contain;

        }


        /* =========================
           MESAJ
        ========================== */

        .message {

            margin-top: 14px;

            font-size: 14px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.75
                );

        }


        /* =========================
           KALPLER
        ========================== */

        .heart {

            position: fixed;

            bottom: -30px;

            font-size: 20px;

            opacity: 0.35;

            pointer-events: none;

            animation:
                heartRise 9s linear infinite;

            z-index: 1;

        }


        @keyframes heartRise {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;

            }

            15% {

                opacity: 0.35;

            }

            85% {

                opacity: 0.25;

            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(180deg);

                opacity: 0;

            }

        }


        /* =========================
           MOBİL
        ========================== */

        @media (max-width: 600px) {

            body {

                padding:
                    15px;

                align-items:
                    center;

            }


            .container {

                padding:
                    35px 20px;

                border-radius:
                    25px;

            }


            h1 {

                font-size:
                    clamp(
                        24px,
                        8vw,
                        34px
                    );

                margin-bottom:
                    28px;

            }


            .buttons {

                gap:
                    12px;

            }


            button {

                min-width:
                    130px;

                padding:
                    14px 25px;

                font-size:
                    15px;

            }


            #result video {

                max-height:
                    48vh;

                border-radius:
                    18px;

            }

        }


        /* =========================
           ÇOK KÜÇÜK TELEFON
        ========================== */

        @media (max-width: 380px) {

            .container {

                padding:
                    30px 16px;

            }


            h1 {

                font-size:
                    23px;

            }


            button {

                min-width:
                    120px;

                padding:
                    13px 20px;

                font-size:
                    14px;

            }

        }


        /* =========================
           DÜŞÜK PERFORMANS / HAREKET
        ========================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            * {

                animation:
                    none !important;

                transition:
                    none !important;

            }

        }

    </style>

</head>


<body>


    <!-- Hafif dekoratif kalpler -->

    <div
        class="heart"
        style="
            left: 10%;
            animation-delay: 0s;
        "
    >
        💖
    </div>


    <div
        class="heart"
        style="
            left: 35%;
            animation-delay: 3s;
        "
    >
        ♡
    </div>


    <div
        class="heart"
        style="
            left: 65%;
            animation-delay: 5s;
        "
    >
        💗
    </div>


    <div
        class="heart"
        style="
            left: 85%;
            animation-delay: 1s;
        "
    >
        ♡
    </div>


    <!-- =========================
         ANA İÇERİK
    ========================== -->

    <main class="container">


        <h1>

            Şapşal Meliss<br>

            Sen Misin ? 🧐💖

        </h1>


        <!-- BUTONLAR -->

        <div class="buttons">


            <button
                class="yes"
                onclick="
                    showVideo(
                        'evet.mp4',
                        'Hehehe 💖'
                    )
                "
            >

                Evet

            </button>


            <button
                class="no"
                onclick="
                    showVideo(
                        'hayir.mp4',
                        'Hmmm... 🧐'
                    )
                "
            >

                Hayır

            </button>


        </div>


        <!-- =========================
             VİDEO
        ========================== -->

        <div id="result">


            <video
                id="resultVideo"
                controls
                playsinline
                preload="metadata"
            >

                <source
                    id="videoSource"
                    src=""
                    type="video/mp4"
                >

                Tarayıcınız video
                oynatmayı desteklemiyor.

            </video>


            <div
                class="message"
                id="message"
            ></div>


        </div>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        function showVideo(
            videoFile,
            message
        ) {


            const result =
                document.getElementById(
                    "result"
                );


            const video =
                document.getElementById(
                    "resultVideo"
                );


            const source =
                document.getElementById(
                    "videoSource"
                );


            const messageElement =
                document.getElementById(
                    "message"
                );


            /* Video adresini değiştir */

            source.src =
                videoFile;


            /* Videoyu yeniden yükle */

            video.load();


            /* Alanı göster */

            result.style.display =
                "block";


            /* Mesaj */

            messageElement.textContent =
                message;


            /* Otomatik oynat */

            video.play().catch(
                () => {}
            );


            /* Video açılınca yukarı kaydır */

            setTimeout(() => {

                result.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            }, 100);

        }


    </script>


</body>

</html>
