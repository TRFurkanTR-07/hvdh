<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şapşal Meliss 💖</title>

    <!-- Limon Milk fontu -->
    <style>
        @import url('https://fonts.cdnfonts.com/css/limon-milk');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            font-family: 'Lemon/Milk', sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(255, 105, 180, 0.35), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.35), transparent 30%),
                linear-gradient(135deg, #16001f, #3b0b45, #13001c);

            position: relative;
        }

        /* Arka plan ışıkları */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            background: #ff4fa3;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c3aed;
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(70px, 50px);
            }
        }

        /* Küçük kalpler */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.18);
            font-size: 25px;
            animation: rise 8s linear infinite;
            pointer-events: none;
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Ana kutu */
        .container {
            position: relative;
            z-index: 2;

            width: min(90%, 650px);
            padding: 55px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-radius: 35px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.04);

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            color: white;
            font-size: clamp(28px, 5vw, 46px);
            line-height: 1.3;

            text-shadow:
                0 0 10px rgba(255, 105, 180, 0.7),
                0 0 30px rgba(255, 105, 180, 0.35);

            margin-bottom: 40px;
        }

        /* Butonlar */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            outline: none;

            padding: 16px 42px;

            border-radius: 999px;

            font-family: inherit;
            font-size: 18px;
            font-weight: bold;

            color: white;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .yes {
            background: linear-gradient(135deg, #ff4fa3, #ff79bd);

            box-shadow:
                0 10px 30px rgba(255, 79, 163, 0.35);
        }

        .no {
            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .yes:hover {
            box-shadow:
                0 15px 40px rgba(255, 79, 163, 0.55);
        }

        .no:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Resim alanı */
        #result {
            display: none;
            margin-top: 35px;

            animation: resultAppear 0.5s ease;
        }

        @keyframes resultAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #result img {
            width: 100%;
            max-width: 420px;
            max-height: 400px;

            object-fit: contain;

            border-radius: 25px;

            border: 2px solid rgba(255, 255, 255, 0.2);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .message {
            color: rgba(255,255,255,0.8);
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Dekoratif kalpler -->
    <div class="heart" style="left:10%; animation-delay:0s;">💖</div>
    <div class="heart" style="left:25%; animation-delay:2s;">♡</div>
    <div class="heart" style="left:45%; animation-delay:4s;">💗</div>
    <div class="heart" style="left:65%; animation-delay:1s;">♡</div>
    <div class="heart" style="left:85%; animation-delay:3s;">💖</div>

    <div class="container">

        <h1>
            Şapşal Meliss<br>
            Sen Misin ? 🧐💖
        </h1>

        <div class="buttons">
            <button class="yes" onclick="showImage('evet.jpg', 'Hehehe 💖')">
                Evet
            </button>

            <button class="no" onclick="showImage('hayir.jpg', 'Hmmm... 🧐')">
                Hayır
            </button>
        </div>

        <!-- Sonuç -->
        <div id="result">
            <img id="resultImage" src="" alt="Sonuç">
            <div class="message" id="message"></div>
        </div>

    </div>

    <script>
        function showImage(image, message) {

            const result = document.getElementById("result");
            const resultImage = document.getElementById("resultImage");
            const messageText = document.getElementById("message");

            resultImage.src = image;
            messageText.textContent = message;

            result.style.display = "block";
        }
    </script>

</body>
</html>
