<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobil Uygulama</title>
  <style>
    /* Lemon Milk Font Tanımlaması */
    @font-face {
      font-family: 'LemonMilk';
      src: url('https://fonts.cdnfonts.com/s/18166/LEMONMILK-Regular.woff') format('woff');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'LemonMilk', sans-serif;
    }

    body {
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Mobil Ekran Çerçevesi */
    .mobile-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      text-align: center;
    }

    /* Ana Başlık Yazısı */
    .title {
      font-size: 24px;
      color: #333;
      margin-top: 50px;
      word-break: break-word;
    }

    /* Buton Alanı */
    .button-group {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 30px;
    }

    .btn {
      background: transparent;
      border: none;
      cursor: pointer;
      outline: none;
      padding: 10px;
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Buton İçi Görsel */
    .btn img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    /* Tam Ekran Siyah Video Katmanı */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Ekranda Görünecek Yazı -->
    <h1 class="title"> ŞAPŞİK MELİSS SEN MİSİN ? 🧐💖 </h1>

    <!-- Butonlar -->
    <div class="button-group">
      <!-- Sol Buton (Video Açan) -->
      <button class="btn" id="leftBtn">
        <img src="sol-buton-resmi.png" alt="Sol Buton">
      </button>

      <!-- Sağ Buton (Devamını Anlatacağın Kısım) -->
      <button class="btn" id="rightBtn">
        <img src="sag-buton-resmi.png" alt="Sağ Buton">
      </button>
    </div>

    <!-- Siyah Ekran Video Katmanı -->
    <div class="video-overlay" id="videoOverlay">
      <video id="myVideo" src="video.mp4" playsinline muted></video>
    </div>
  </div>

  <script>
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    const videoOverlay = document.getElementById('videoOverlay');
    const myVideo = document.getElementById('myVideo');

    // Sol Butona Basıldığında
    leftBtn.addEventListener('click', () => {
      videoOverlay.style.display = 'flex'; // Siyah ekranı aç
      myVideo.currentTime = 0;
      myVideo.play(); // Videoyu başlat

      // 10 saniye (10000 ms) sonra kapat ve ana sayfaya dön
      setTimeout(() => {
        myVideo.pause();
        videoOverlay.style.display = 'none'; // Siyah ekranı gizle
      }, 10000);
    });

        // Sağ Buton Dinleyicisi
    rightBtn.addEventListener('click', () => {
      // Sağ buton mantığı buraya gelecek
    });

    // --- BURADAN İTİBAREN EKLENECEK MÜZİK KODLARI ---
    const bgMusic = document.getElementById('bgMusic');

    window.addEventListener('DOMContentLoaded', () => {
      bgMusic.play().catch(() => {
        document.addEventListener('click', () => {
          bgMusic.play();
        }, { once: true });
      });
    });
  </script>

  <!-- HTML MÜZİK ETİKETİ -->
  <audio id="bgMusic" autoplay loop>
    <source src="Çıt Çıt Çedene – Anadolu Remix  Psychedelic Anatolian Rock.mp3" type="audio/mpeg">
  </audio>

</body>
</html>
